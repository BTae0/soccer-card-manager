<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="축구카드 컬렉션을 종합 관리하는 무료 앱. 카드 보유현황, 구매이력, 배송추적, 지출분석을 한 곳에서.">
  <meta name="theme-color" content="#0A0E17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⚽ 축구카드 매니저</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- App Container -->
  <div id="app">

    <!-- Header -->
    <header id="app-header">
      <h1 id="header-title">⚽ 축구카드 매니저</h1>
      <button id="header-action-btn" class="header-btn hidden" aria-label="액션">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </header>

    <!-- Tab Content Area -->
    <main id="tab-content">

      <!-- ===== TAB 1: Dashboard ===== -->
      <section id="tab-dashboard" class="tab-panel active">
        <div class="dashboard-grid">
          <div class="stat-card stat-total-cards">
            <div class="stat-icon">🃏</div>
            <div class="stat-info">
              <span class="stat-value" id="stat-total-cards">0</span>
              <span class="stat-label">보유 카드</span>
            </div>
          </div>
          <div class="stat-card stat-total-spent">
            <div class="stat-icon">💰</div>
            <div class="stat-info">
              <span class="stat-value" id="stat-total-spent">₩0</span>
              <span class="stat-label">총 구매액</span>
            </div>
          </div>
          <div class="stat-card stat-total-value">
            <div class="stat-icon">📈</div>
            <div class="stat-info">
              <span class="stat-value" id="stat-total-value">₩0</span>
              <span class="stat-label">총 시세</span>
            </div>
          </div>
          <div class="stat-card stat-month-spent">
            <div class="stat-icon">📅</div>
            <div class="stat-info">
              <span class="stat-value" id="stat-month-spent">₩0</span>
              <span class="stat-label">이번달 지출</span>
            </div>
          </div>
        </div>

        <!-- Shipping alerts -->
        <div id="shipping-alerts" class="section-block hidden">
          <h2 class="section-title">📦 배송 현황</h2>
          <div id="shipping-alerts-list" class="alert-list"></div>
        </div>

        <!-- Recent cards -->
        <div id="recent-cards" class="section-block">
          <h2 class="section-title">🆕 최근 등록 카드</h2>
          <div id="recent-cards-list" class="card-scroll-list"></div>
          <div id="recent-cards-empty" class="empty-state">
            <span class="empty-icon">🎴</span>
            <p>아직 등록된 카드가 없어요</p>
            <button class="btn btn-primary" onclick="App.switchTab('collection')">첫 카드 등록하기</button>
          </div>
        </div>
      </section>

      <!-- ===== TAB 2: Collection ===== -->
      <section id="tab-collection" class="tab-panel">
        <!-- Search & Filter Bar -->
        <div class="search-bar">
          <div class="search-input-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="collection-search" placeholder="카드명 검색..." autocomplete="off">
          </div>
          <button id="collection-filter-btn" class="filter-btn" aria-label="필터">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </button>
          <button id="collection-view-toggle" class="filter-btn" aria-label="뷰 전환">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
        </div>

        <!-- Filter Panel (hidden by default) -->
        <div id="collection-filter-panel" class="filter-panel hidden">
          <div class="filter-group">
            <label>브랜드</label>
            <select id="filter-brand"><option value="">전체</option></select>
          </div>
          <div class="filter-group">
            <label>시즌</label>
            <select id="filter-season"><option value="">전체</option></select>
          </div>
          <div class="filter-group">
            <label>등급</label>
            <select id="filter-grade"><option value="">전체</option></select>
          </div>
          <div class="filter-actions">
            <button class="btn btn-ghost" id="filter-reset">초기화</button>
            <button class="btn btn-primary" id="filter-apply">적용</button>
          </div>
        </div>

        <!-- Card List -->
        <div id="collection-list" class="collection-grid"></div>
        <div id="collection-empty" class="empty-state">
          <span class="empty-icon">🃏</span>
          <p>컬렉션이 비어있어요</p>
          <button class="btn btn-primary" onclick="Collection.openAddModal()">카드 등록하기</button>
        </div>
      </section>

      <!-- ===== TAB 3: Purchases ===== -->
      <section id="tab-purchases" class="tab-panel">
        <div class="search-bar">
          <div class="search-input-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="purchase-search" placeholder="사이트, 판매자 검색..." autocomplete="off">
          </div>
          <div class="status-filter-chips" id="purchase-status-chips">
            <button class="chip active" data-status="all">전체</button>
            <button class="chip" data-status="shipping">배송중</button>
            <button class="chip" data-status="keeping">킵</button>
            <button class="chip" data-status="received">수령완료</button>
          </div>
        </div>

        <div id="purchase-list" class="purchase-list"></div>
        <div id="purchase-empty" class="empty-state">
          <span class="empty-icon">🛒</span>
          <p>구매 이력이 없어요</p>
          <button class="btn btn-primary" onclick="Purchases.openAddModal()">구매 기록하기</button>
        </div>
      </section>

      <!-- ===== TAB 4: Analytics ===== -->
      <section id="tab-analytics" class="tab-panel">
        <div class="analytics-summary">
          <div class="analytics-card">
            <span class="analytics-label">총 지출</span>
            <span class="analytics-value" id="analytics-total-spent">₩0</span>
          </div>
          <div class="analytics-card">
            <span class="analytics-label">총 배송비</span>
            <span class="analytics-value" id="analytics-total-shipping">₩0</span>
          </div>
          <div class="analytics-card">
            <span class="analytics-label">월 평균 지출</span>
            <span class="analytics-value" id="analytics-avg-monthly">₩0</span>
          </div>
          <div class="analytics-card profit-card">
            <span class="analytics-label">수익률</span>
            <span class="analytics-value" id="analytics-profit-rate">-</span>
          </div>
        </div>

        <div class="chart-section">
          <h2 class="section-title">📊 월별 지출</h2>
          <canvas id="chart-monthly" width="400" height="200"></canvas>
        </div>

        <div class="chart-section">
          <h2 class="section-title">🏪 사이트별 지출</h2>
          <canvas id="chart-site" width="400" height="200"></canvas>
          <div id="chart-site-legend" class="chart-legend"></div>
        </div>

        <div id="analytics-empty" class="empty-state hidden">
          <span class="empty-icon">📊</span>
          <p>데이터가 쌓이면 분석을 볼 수 있어요</p>
        </div>
      </section>

      <!-- ===== TAB 5: Settings ===== -->
      <section id="tab-settings" class="tab-panel">
        <div class="settings-list">
          <div class="settings-group">
            <h2 class="settings-group-title">데이터 관리</h2>
            <button class="settings-item" id="btn-export">
              <span class="settings-item-icon">📤</span>
              <span class="settings-item-text">
                <span class="settings-item-title">데이터 내보내기</span>
                <span class="settings-item-desc">JSON 파일로 백업</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="settings-item" id="btn-import">
              <span class="settings-item-icon">📥</span>
              <span class="settings-item-text">
                <span class="settings-item-title">데이터 가져오기</span>
                <span class="settings-item-desc">백업 파일에서 복원</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <input type="file" id="import-file-input" accept=".json" class="hidden">
            <button class="settings-item danger" id="btn-clear-data">
              <span class="settings-item-icon">🗑️</span>
              <span class="settings-item-text">
                <span class="settings-item-title">데이터 전체 삭제</span>
                <span class="settings-item-desc">모든 데이터를 삭제합니다</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>

          <div class="settings-group">
            <h2 class="settings-group-title">화면 설정</h2>
            <div class="settings-item toggle-item">
              <span class="settings-item-icon">🌙</span>
              <span class="settings-item-text">
                <span class="settings-item-title">다크 모드</span>
              </span>
              <label class="toggle-switch">
                <input type="checkbox" id="toggle-dark-mode" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="settings-group">
            <h2 class="settings-group-title">기본 설정</h2>
            <div class="settings-item">
              <span class="settings-item-icon">💱</span>
              <span class="settings-item-text">
                <span class="settings-item-title">기본 통화</span>
              </span>
              <select id="default-currency" class="settings-select">
                <option value="KRW">₩ KRW</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="JPY">¥ JPY</option>
                <option value="GBP">£ GBP</option>
              </select>
            </div>
          </div>

          <div class="settings-group">
            <h2 class="settings-group-title">정보</h2>
            <div class="settings-item">
              <span class="settings-item-icon">ℹ️</span>
              <span class="settings-item-text">
                <span class="settings-item-title">버전</span>
                <span class="settings-item-desc">v1.0.0</span>
              </span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-item active" data-tab="dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>홈</span>
      </button>
      <button class="nav-item" data-tab="collection">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>카드</span>
      </button>
      <button class="nav-item" data-tab="purchases">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span>구매</span>
      </button>
      <button class="nav-item" data-tab="analytics">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>분석</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>설정</span>
      </button>
    </nav>

    <!-- FAB (Floating Action Button) -->
    <button id="fab-add" class="fab hidden" aria-label="추가">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- ===== MODAL: Add/Edit Card ===== -->
    <div id="modal-card" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-card-title">카드 등록</h2>
          <button class="modal-close" onclick="Collection.closeModal()">✕</button>
        </div>
        <form id="form-card" class="modal-body">
          <input type="hidden" id="card-id">

          <div class="form-group">
            <label for="card-player">카드명 *</label>
            <input type="text" id="card-player" required placeholder="예: 손흥민 Topps Chrome RC" autocomplete="off">
          </div>

          <div class="form-group">
            <label for="card-grade">등급</label>
            <input type="text" id="card-grade" placeholder="예: PSA 10, Raw" list="grade-suggestions" autocomplete="off">
            <datalist id="grade-suggestions">
              <option value="Raw">
              <option value="PSA 10">
              <option value="PSA 9">
              <option value="PSA 8">
              <option value="BGS 10">
              <option value="BGS 9.5">
              <option value="BGS 9">
              <option value="SGC 10">
            </datalist>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="card-purchase-price">구매가 (₩)</label>
              <input type="number" id="card-purchase-price" placeholder="0" min="0" step="any">
            </div>
            <div class="form-group">
              <label for="card-current-value">시세 (₩)</label>
              <input type="number" id="card-current-value" placeholder="선택사항" min="0" step="any">
            </div>
          </div>

          <div class="form-group">
            <label for="card-memo">메모</label>
            <textarea id="card-memo" rows="2" placeholder="브랜드, 시즌, 컨디션 등"></textarea>
          </div>

          <div class="form-group">
            <label for="card-photo">사진</label>
            <div class="photo-upload" id="card-photo-area">
              <input type="file" id="card-photo" accept="image/*" class="hidden">
              <div id="card-photo-preview" class="photo-preview hidden">
                <img id="card-photo-img" src="" alt="카드 사진">
                <button type="button" class="photo-remove" onclick="Collection.removePhoto()">✕</button>
              </div>
              <div id="card-photo-placeholder" class="photo-placeholder" onclick="document.getElementById('card-photo').click()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>사진 추가</span>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="Collection.closeModal()">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== MODAL: Add/Edit Purchase ===== -->
    <div id="modal-purchase" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-purchase-title">구매 기록</h2>
          <button class="modal-close" onclick="Purchases.closeModal()">✕</button>
        </div>
        <form id="form-purchase" class="modal-body">
          <input type="hidden" id="purchase-id">

          <div class="form-group">
            <label for="purchase-site">구매 사이트 *</label>
            <input type="text" id="purchase-site" required placeholder="예: eBay, 네이버카페" list="site-suggestions" autocomplete="off">
            <datalist id="site-suggestions"></datalist>
          </div>

          <div class="form-group">
            <label for="purchase-seller">판매자</label>
            <input type="text" id="purchase-seller" placeholder="예: cardshop123" list="seller-suggestions" autocomplete="off">
            <datalist id="seller-suggestions"></datalist>
          </div>

          <div class="form-group">
            <label for="purchase-date">구매일 *</label>
            <input type="date" id="purchase-date" required>
          </div>

          <div class="form-group">
            <label for="purchase-item-desc">구매 내용</label>
            <input type="text" id="purchase-item-desc" placeholder="예: 손흥민 Topps Chrome RC" autocomplete="off">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="purchase-amount">구매 금액 *</label>
              <input type="number" id="purchase-amount" required placeholder="0" min="0" step="any">
            </div>
            <div class="form-group">
              <label for="purchase-currency">통화</label>
              <select id="purchase-currency">
                <option value="KRW">₩ KRW</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="JPY">¥ JPY</option>
                <option value="GBP">£ GBP</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="purchase-shipping-cost">배송비</label>
              <input type="number" id="purchase-shipping-cost" placeholder="0" min="0" step="any">
            </div>
            <div class="form-group">
              <label for="purchase-quantity">수량</label>
              <input type="number" id="purchase-quantity" placeholder="1" min="1" value="1">
            </div>
          </div>

          <div class="form-group">
            <label for="purchase-status">배송 상태</label>
            <div class="status-selector">
              <label class="status-option">
                <input type="radio" name="purchase-status" value="shipping" checked>
                <span class="status-badge status-shipping">📦 배송중</span>
              </label>
              <label class="status-option">
                <input type="radio" name="purchase-status" value="keeping">
                <span class="status-badge status-keeping">📌 킵</span>
              </label>
              <label class="status-option">
                <input type="radio" name="purchase-status" value="received">
                <span class="status-badge status-received">✅ 수령완료</span>
              </label>
            </div>
          </div>



          <div class="form-group">
            <label for="purchase-memo">메모</label>
            <textarea id="purchase-memo" rows="2" placeholder="특이사항 등"></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="Purchases.closeModal()">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== MODAL: Card Detail ===== -->
    <div id="modal-card-detail" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">

        </div>
        <div id="card-detail-content" class="modal-body card-detail"></div>
      </div>
    </div>

          <button class="btn btn-ghost" id="confirm-cancel">취소</button>
